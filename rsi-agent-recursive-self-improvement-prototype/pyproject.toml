[project]
name = "rsi-agent"
version = "0.2.0"
description = "Bounded, auditable, reversible recursive self-improvement pipeline for coding agents with Jev orchestration"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rsi-demo = "demo:main"
rsi = "rsi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rsi"]
py-modules = ["demo"]
