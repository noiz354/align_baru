# HomeOps — shared job setup (T-PLAT-009): Node 24, npm cache, `npm ci` from the committed lockfile.
name: setup
description: Install Node 24 and dependencies from package-lock.json
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - name: Install (lockfile only; postinstall scripts stay blocked except the pinned allow-list)
      shell: bash
      run: npm ci --no-audit --no-fund
