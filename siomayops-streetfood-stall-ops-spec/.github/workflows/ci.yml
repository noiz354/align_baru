name: siomayops-checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Unit and integration tests
        run: pnpm test
      - name: Production build
        run: pnpm run build
      - name: Install Chromium for browser journeys
        run: pnpm exec playwright install --with-deps chromium
      - name: Dashboard browser journey
        run: pnpm exec playwright test tests/e2e/hq-coverage.spec.ts --project=hq-desktop
