# =============================================================================
# Optional overlay: POLLING FILE WATCHING for non-Linux Docker (T-FOUND-010).
#
# Task:      T-FOUND-010 (edge case: "non-Linux docker (file watching)").
# Authority: DEPLOYMENT.md §8 (dev row), the port/watching block in
#            ./docker-compose.dev.yml.
#
# ── WHEN YOU NEED THIS ──────────────────────────────────────────────────────
# On Docker Desktop (macOS/Windows) the bind mount is served by a Linux VM, and
# inotify events do not cross that boundary. Next's dev server therefore never
# learns that a file changed: save, and the browser keeps showing the old page
# until you touch the URL. Nothing in the logs looks wrong — that silence is the
# symptom. On Linux (including WSL2 with the project inside the WSL2 filesystem)
# the default setup already works and this file is unnecessary.
#
# ── WHY IT IS AN OVERLAY AND NOT A VARIABLE IN THE MAIN FILE ───────────────
# WATCHPACK_POLLING is read as a string, and a variable that is "unset by
# default" would have to be passed as an empty string — which several watcher
# implementations treat as truthy. Making it a separate file means the default
# path sets NOTHING (so Linux pays no polling cost) and the opt-in path sets an
# unambiguous "true".
#
# ── COST ────────────────────────────────────────────────────────────────────
# Polling stats the source tree on an interval: measurable CPU on a large tree,
# and slower than inotify. Drop this overlay when you are back on Linux.
#
# ── USAGE ───────────────────────────────────────────────────────────────────
#   docker compose -f docker/docker-compose.dev.yml \
#                    -f docker/docker-compose.dev.poll.yml up -d
#   # tear down (the overlay has no state of its own, so one -f list is enough)
#   docker compose -f docker/docker-compose.dev.yml \
#                    -f docker/docker-compose.dev.poll.yml down -v
#
# Alternative, if you would rather not poll: `docker compose watch` (syncs on
# poll, but rebuilds instead of hot-reloading) or keep everything on Linux/WSL2.
# =============================================================================

services:
  app:
    environment:
      WATCHPACK_POLLING: "true"

  # The migration job compiles drizzle.config.ts and never watches anything, so
  # it is deliberately NOT given the variable.
